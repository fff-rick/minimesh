syntax = "proto3";

package minimesh.v1;

option go_package = "github.com/minimesh/minimesh/api/gen/minimesh/v1;minimeshv1";
option java_package = "io.minimesh.v1";
option java_multiple_files = true;

// BuildInfo is a Stage 0 bootstrap message used to verify the protobuf
// toolchain. Runtime RPC contracts are introduced in later stages.
message BuildInfo {
  string component = 1;
  string version = 2;
}
