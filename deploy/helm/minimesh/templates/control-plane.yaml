apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minimesh.fullname" . }}-control-plane
  labels:
    {{- include "minimesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "minimesh.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-plane
    spec:
      containers:
        - name: control-plane
          image: {{ .Values.images.controlPlane | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --listen=:{{ .Values.controlPlane.registryPort }}
            - --control-listen=:{{ .Values.controlPlane.streamPort }}
            - --etcd=http://{{ include "minimesh.fullname" . }}-etcd:2379
            - --lease-ttl={{ .Values.controlPlane.leaseTTL }}
          ports:
            - {name: registry, containerPort: {{ .Values.controlPlane.registryPort }}}
            - {name: control, containerPort: {{ .Values.controlPlane.streamPort }}}
          readinessProbe:
            httpGet: {path: /healthz, port: registry}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: registry}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.controlPlane | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "minimesh.fullname" . }}-control-plane
  labels:
    {{- include "minimesh.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports:
    - {name: registry, port: {{ .Values.controlPlane.registryPort }}, targetPort: registry}
    - {name: control, port: {{ .Values.controlPlane.streamPort }}, targetPort: control}
