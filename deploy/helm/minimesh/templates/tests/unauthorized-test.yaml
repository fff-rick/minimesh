{{- if .Values.security.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "minimesh.fullname" . }}-unauthorized-test
  labels:
    {{- include "minimesh.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "minimesh.name" . }}-unauthorized-test
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: {{ .Values.images.client | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if /client --sidecar {{ include "minimesh.fullname" . }}-order-sidecar:{{ .Values.sidecar.grpcPort }} --service recommendation --message unauthorized --timeout 2s; then
                echo "unauthorized order -> recommendation call unexpectedly succeeded" >&2
                exit 1
              fi
              echo "unauthorized order -> recommendation call rejected"
{{- end }}
