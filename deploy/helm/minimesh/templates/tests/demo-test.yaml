apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "minimesh.fullname" . }}-test
  labels:
    {{- include "minimesh.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "minimesh.name" . }}-test
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: {{ .Values.images.order | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["java", "-cp", "/app/order-service.jar", "io.minimesh.examples.order.OrderClient"]
          env:
            - {name: ORDER_ADDRESS, value: "{{ include "minimesh.fullname" . }}-order:{{ .Values.services.order.port }}"}
            - {name: ORDER_SKU, value: book}
