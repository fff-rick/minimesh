services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: minimesh-etcd
    command:
      - /usr/local/bin/etcd
      - --name=minimesh-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=minimesh-etcd=http://127.0.0.1:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=minimesh-stage0
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 15

  proto:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: deploy/docker/proto.Dockerfile
    volumes:
      - ../..:/workspace

  stage9-control-plane:
    profiles: ["stage9"]
    build:
      context: ../..
      dockerfile: deploy/docker/stage9-go.Dockerfile
      target: control-plane
    command: ["--listen=:17070", "--control-listen=:17071", "--etcd=http://etcd:2379"]
    ports: ["37070:17070"]
    depends_on:
      etcd:
        condition: service_healthy

  stage9-sidecar-order:
    profiles: ["stage9"]
    build:
      context: ../..
      dockerfile: deploy/docker/stage9-go.Dockerfile
      target: sidecar
    command: ["--listen=:18080", "--control-plane=stage9-control-plane:17071", "--sidecar-id=stage9-order", "--max-attempts=1"]
    depends_on: [stage9-control-plane]

  stage9-sidecar-inventory:
    profiles: ["stage9"]
    build:
      context: ../..
      dockerfile: deploy/docker/stage9-go.Dockerfile
      target: sidecar
    command: ["--listen=:18080", "--control-plane=stage9-control-plane:17071", "--sidecar-id=stage9-inventory", "--max-attempts=1"]
    depends_on: [stage9-control-plane]

  stage9-inventory:
    profiles: ["stage9"]
    build:
      context: ../..
      dockerfile: deploy/docker/stage9-go.Dockerfile
      target: inventory
    command: ["--listen=:19091", "--sidecar=stage9-sidecar-inventory:18080"]
    depends_on: [stage9-sidecar-inventory]

  stage9-recommendation:
    profiles: ["stage9"]
    build:
      context: ../..
      dockerfile: deploy/docker/stage9-python.Dockerfile
    depends_on: [stage9-control-plane]

  stage9-order:
    profiles: ["stage9"]
    image: minimesh-stage9-order:latest
    build:
      context: ../..
      dockerfile: deploy/docker/stage9-java.Dockerfile
    environment:
      SIDECAR_ADDRESS: stage9-sidecar-order:18080
    ports: ["39090:19090"]
    depends_on: [stage9-sidecar-order]

  stage9-order-client:
    profiles: ["stage9-client"]
    # Reuse the Order image built by the stage9 profile. Keeping a second
    # build here let `compose run` execute an older client JAR.
    image: minimesh-stage9-order:latest
    command: ["io.minimesh.examples.order.OrderClient"]
    environment:
      ORDER_ADDRESS: stage9-order:19090
    depends_on: [stage9-order]

volumes:
  etcd-data:
